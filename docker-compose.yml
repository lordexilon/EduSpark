

services:
  # Frontend - Vite App con Nginx
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - eduspark-network

  # Worker - RAG Indexing Worker
  worker:
    build:
      context: .
      target: worker
    ports:
      - "3001:3001"
    environment:
      # Gemini API
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
      
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_SERVICE_ROLE_KEY=${VITE_SUPABASE_SERVICE_ROLE_KEY}
      
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - eduspark-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AISpark Core - Langflow
  langflow:
    image: langflowai/langflow:latest
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_HOST=0.0.0.0
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=admin12345
      - LANGFLOW_SSRF_ALLOWED_HOSTS=host.docker.internal
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true
      # Persist LangFlow in the local Supabase Postgres instance.
      # A dedicated database keeps LangFlow metadata isolated from EduSpark.
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL:-postgresql://postgres:postgres@supabase_db_eduspark-lms-local:5432/langflow}
      # You can add API keys here for Langflow to use automatically
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - langflow-data:/app/langflow
      - .:/data/documents
    restart: unless-stopped
    networks:
      - eduspark-network
      - supabase_network_eduspark-lms-local

volumes:
  langflow-data:


networks:
  eduspark-network:
    driver: bridge
  supabase_network_eduspark-lms-local:
    external: true
