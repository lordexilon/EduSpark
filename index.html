<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      /* Colors */
      --primary: #0ACF83; /* Main Green */
      --secondary: #A855F7; /* Purple Accent */
      --text-dark: #1F2937;
      --text-light: #6B7280;
      --background: #F9FAFB;
      --surface: #FFFFFF;
      --border: #E5E7EB;
      --gradient-a-start: #E0F2FE;
      --gradient-a-end: #C7D2FE;
      --gradient-b-start: #D1FAE5;
      --gradient-b-end: #A7F3D0;

      /* Typography */
      --font-family: 'Inter', sans-serif;
      
      /* Layout */
      --card-border-radius: 1rem; /* 16px */
      --card-box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
    }
    body {
      font-family: var(--font-family);
      background-color: var(--background);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
  <script>
    /* Custom tailwind config */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary)',
            secondary: 'var(--secondary)',
            'text-dark': 'var(--text-dark)',
            'text-light': 'var(--text-light)',
            background: 'var(--background)',
            surface: 'var(--surface)',
            border: 'var(--border)',
            'gradient-a-start': 'var(--gradient-a-start)',
            'gradient-a-end': 'var(--gradient-a-end)',
            'gradient-b-start': 'var(--gradient-b-start)',
            'gradient-b-end': 'var(--gradient-b-end)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'card': 'var(--card-border-radius)',
          },
          boxShadow: {
            'card': 'var(--card-box-shadow)',
          },
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background text-text-dark">
  <div id="root"></div>
  <script type="text/babel" data-presets="react,typescript" data-type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
