steps:
  # Paso 1: Build de la imagen Docker (usando el dist local subido)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile-cloudrun'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'
      - '.'
    id: 'build-image'

  # Paso 2: Push a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID']
    id: 'push-image-tagged'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:latest']
    id: 'push-image-latest'
    waitFor: ['build-image']



images:
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
