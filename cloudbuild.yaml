steps:
  # Paso 1: Compilar el frontend
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-dependencies'

  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    id: 'build-frontend'
    env:
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}'
      - 'VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}'
      - 'VITE_GOOGLE_CLIENT_SECRET=${_VITE_GOOGLE_CLIENT_SECRET}'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - 'VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}'

  # Paso 2: Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile-cloudrun'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'
      - '.'
    id: 'build-image'
    waitFor: ['build-frontend']

  # Paso 3: Push a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID']
    id: 'push-image-tagged'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:latest']
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Paso 4: Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eduspark-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--cpu-throttling'
      - '--no-cpu-boost'
    id: 'deploy-service'
    waitFor: ['push-image-tagged']

images:
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

