steps:
  # Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target'
      - 'frontend'
      - '-f'
      - 'Dockerfile-cloudrun'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'
      - '.'

  # Push a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eduspark-frontend:latest']

  # Deploy a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eduspark-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--cpu-throttling'
      - '--no-cpu-boost'

images:
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/eduspark-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

